[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-triton-flash-attn"
version = "0.1.0"
description = "Triton Flash Attention for Gemma4-style GQA with large HEAD_DIM and sliding window support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "haojun" }]
keywords = ["triton", "attention", "flash-attention", "gqa", "sliding-window", "gemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0",
    "triton>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark"]

[project.urls]
Homepage = "https://github.com/user/gemma-triton-flash-attn"

[tool.setuptools]
packages = ["gemma_triton_flash_attn"]

[tool.setuptools.package-dir]
gemma_triton_flash_attn = "flash_attn"

[tool.uv.workspace]
members = [
    "tests/gemma4_integration",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "tests/gemma4_integration",
    "tests/legacy",
]
addopts = [
    "--strict-markers",
    "--ignore=tests/test_packed_dkv.py",
    "--ignore=tests/test_varlen_correctness.py",
    "--ignore=tests/test_varlen_edge_cases.py",
    "--ignore=tests/test_varlen_scaling.py",
    "--ignore=tests/test_varlen_vs_flash_attn.py",
]
markers = [
    "gpu: requires a CUDA GPU and may JIT-compile Triton kernels",
    "integration: requires optional framework/model dependencies",
    "distributed: requires a multi-process distributed launch",
    "slow: takes more than the fast correctness budget",
    "performance: measures latency, throughput, memory, or profiler signals",
]
